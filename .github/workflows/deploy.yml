name: Deploy CRM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Test app
        run: |
          npm ci
          npm test

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing secret: VPS_HOST'; exit 1; }
          test -n "$VPS_USER" || { echo 'Missing secret: VPS_USER'; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo 'Missing secret: VPS_SSH_KEY'; exit 1; }
          test -n "$VPS_SSH_PORT" || { echo 'Missing secret: VPS_SSH_PORT'; exit 1; }

      - name: Prepare app package
        run: |
          set -euo pipefail
          mkdir deploy_dist
          cp -a Dockerfile docker-compose.yml .env.example package.json package-lock.json README.md deploy_dist/
          cp -a src public deploy_dist/
          tar -C deploy_dist -czf crm-deploy.tgz .

      - name: Upload app package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: crm-deploy.tgz
          target: /tmp/crm-upload-${{ github.run_id }}
          rm: true
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: Replace Twenty and deploy CRM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            trap 'status=$?; echo "Deploy failed at line $LINENO (exit $status)." >&2; exit "$status"' ERR

            APP_DIR=/home/app/crm
            UPLOAD_DIR=/tmp/crm-upload-${{ github.run_id }}
            PACKAGE="$UPLOAD_DIR/crm-deploy.tgz"
            echo 'Checking uploaded package...'
            if [ ! -f "$PACKAGE" ]; then
              PACKAGE="$UPLOAD_DIR/crm-deploy.tgz/crm-deploy.tgz"
            fi
            if [ ! -f "$PACKAGE" ]; then
              echo "Deployment package is missing from $UPLOAD_DIR."
              exit 1
            fi
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "Missing $APP_DIR/.env; add ADMIN_USER, ADMIN_PASS, and SESSION_SECRET."
              exit 1
            fi

            APP_ENV="$APP_DIR/internal-crm-finance/.env"
            if [ -f "$APP_ENV" ]; then
              for variable in ADMIN_USER ADMIN_PASS SESSION_SECRET; do
                if ! grep -q "^${variable}=." "$APP_DIR/.env"; then
                  app_setting=$(grep -m 1 "^${variable}=." "$APP_ENV" || true)
                  if [ -n "$app_setting" ]; then
                    printf '%s\n' "$app_setting" >> "$APP_DIR/.env"
                  fi
                fi
              done
            fi

            if ! grep -q '^ADMIN_USER=.' "$APP_DIR/.env"; then
              printf '\nADMIN_USER=admin\n' >> "$APP_DIR/.env"
              echo 'Using admin as the CRM login name.'
            fi

            for variable in ADMIN_USER ADMIN_PASS SESSION_SECRET; do
              if ! grep -q "^${variable}=." "$APP_DIR/.env"; then
                echo "Missing $variable in $APP_DIR/.env."
                exit 1
              fi
            done

            echo 'Preflight checks passed.'
            LEGACY_DIR="$APP_DIR/packages/twenty-docker"
            if [ -f "$LEGACY_DIR/docker-compose.yml" ] \
              && [ -f "$LEGACY_DIR/docker-compose.prod.yml" ]; then
              echo 'Stopping the old Twenty Compose stack...'
              cd "$LEGACY_DIR"
              docker compose \
                --env-file "$APP_DIR/.env" \
                -f docker-compose.yml \
                -f docker-compose.prod.yml down
            fi

            echo 'Preparing the app directory...'
            mkdir -p "$APP_DIR/data"
            chmod 700 "$APP_DIR"
            chmod 600 "$APP_DIR/.env"
            chown -R 1000:1000 "$APP_DIR/data"

            echo 'Replacing Twenty source with the new app...'
            find "$APP_DIR" -mindepth 1 -maxdepth 1 \
              ! -name '.env' ! -name '.git' ! -name 'data' \
              -exec rm -rf {} +
            tar -xzf "$PACKAGE" -C "$APP_DIR" --no-same-owner
            chown -R 1000:1000 "$APP_DIR/data"

            echo 'Building and starting the app...'
            cd "$APP_DIR"
            docker compose --project-name internal-crm-finance \
              --env-file "$APP_DIR/.env" \
              -f "$APP_DIR/docker-compose.yml" config -q
            docker compose --project-name internal-crm-finance \
              --env-file "$APP_DIR/.env" \
              -f "$APP_DIR/docker-compose.yml" build app
            docker compose --project-name internal-crm-finance \
              --env-file "$APP_DIR/.env" \
              -f "$APP_DIR/docker-compose.yml" \
              up -d --force-recreate --remove-orphans

            for attempt in $(seq 1 40); do
              if curl --fail --silent --show-error --max-time 5 \
                http://127.0.0.1:3002/healthz >/dev/null; then
                rm -rf "$UPLOAD_DIR"
                echo 'Deploy done'
                exit 0
              fi
              sleep 5
            done

            docker compose --project-name internal-crm-finance \
              --env-file "$APP_DIR/.env" \
              -f "$APP_DIR/docker-compose.yml" ps
            docker compose --project-name internal-crm-finance \
              --env-file "$APP_DIR/.env" \
              -f "$APP_DIR/docker-compose.yml" logs --tail 150 app || true
            exit 1
